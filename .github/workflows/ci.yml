name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # requires-python is ">=3.11"; test every version we claim to support
        # rather than stopping at 3.12 with the upper end untested.
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # The test suite covers the platform-neutral core (ini parser, backups,
      # sessions, config, scheduler math) plus the daemon's pure decision
      # helpers. Importing palctl.daemon pulls in aiohttp (its API server) and
      # discord.py (the bot, imported at module level), so both are needed or
      # test_daemon_helpers.py — the auth token gate and crash-auto-recovery
      # tests — silently skips. The GUI stays out, so PySide6 isn't needed.
      - run: pip install httpx psutil keyring aiohttp discord.py pytest
      # discord.py imports the stdlib `audioop`, which was removed in 3.13; the
      # audioop-lts backport puts it back so the bot module still imports.
      - if: matrix.python == '3.13'
        run: pip install audioop-lts
      # The end-to-end scenarios get their own job: they boot real daemons and
      # take minutes, and running them once is worth more than running them six
      # times across the version matrix.
      - run: pytest -v -m "not sim"

  scenarios:
    # The layer that catches what everything above misses. Each test here boots
    # the real daemon against a fake service manager and a fake Palworld server
    # that can hang, crash, or be stopped behind palctl's back — which is how
    # every serious bug in the poll/recovery path actually arrived, and none of
    # them were reachable from a test that patched at the module boundary.
    # Linux-only (the fake service manager is a `systemctl` on PATH).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install httpx psutil keyring aiohttp discord.py pytest
      - run: pytest -v -m sim

  install-lifecycle:
    # Exercises the REAL install state machine against a real Windows SCM — the
    # one thing the unit tests cannot do (they fake WinSW/sc/systemd). Covers
    # the transitions that historically broke: fresh install, reinstall over a
    # RUNNING daemon (must replace it, not no-op), switching service → login
    # startup (must remove the service and keep exactly one daemon), and full
    # removal. Also re-downloads WinSW and checks it against the pinned SHA-256,
    # so the pin is re-verified from independent infrastructure on every run.
    #
    # Three things here can only be proved by a real SCM and a real Task
    # Scheduler, and each one shipped broken precisely because nothing executed
    # it: the wrapper's restart policy (an unbounded 5-second loop looks exactly
    # like a healthy service in every unit test), the health task's ability to
    # ACTUALLY RUN (schtasks registered it fine; the command inside could not
    # resolve), and handing the game server's boot start back to Windows when
    # palctl stops providing it.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install httpx psutil keyring aiohttp discord.py
      - name: Verify the pinned WinSW hash against the release bytes
        shell: pwsh
        run: |
          $url = python -c "from palctl.winservice import WINSW_URL; print(WINSW_URL)"
          $pinned = python -c "from palctl.winservice import WINSW_SHA256; print(WINSW_SHA256.lower())"
          Invoke-WebRequest -Uri $url -OutFile winsw-pin-check.exe
          $actual = (Get-FileHash winsw-pin-check.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "downloaded: $actual"
          Write-Host "pinned:     $pinned"
          if ($actual -ne $pinned) { throw "WINSW_SHA256 pin does not match the release asset" }
      - name: Fresh service install (must come up verified)
        shell: pwsh
        run: |
          python -m palctl.daemon install-service
          if ($LASTEXITCODE -ne 0) { throw "fresh install-service failed" }
          sc.exe query palctl-daemon
          if ($LASTEXITCODE -ne 0) { throw "service not registered after install" }
          $daemonPid = @((Get-NetTCPConnection -LocalPort 8830 -State Listen).OwningProcess)[0]
          "DAEMON_PID=$daemonPid" >> $env:GITHUB_ENV
          exit 0
      - name: The service wrapper must be able to give up, not loop forever
        shell: pwsh
        run: |
          # A daemon that can never start (port held, unwritable config dir) was
          # restarted every 5 seconds for good. Unit tests pin the generated
          # XML; this pins that the XML a REAL registration wrote says it too.
          $xml = Get-Content "$env:APPDATA\palctl\bin\palctl-daemon-service.xml" -Raw
          Write-Host $xml
          if ($xml -notmatch '<onfailure action="none"/>') {
            throw "the registered service has no terminal onfailure - it will restart forever"
          }
          if (([regex]::Matches($xml, '<onfailure')).Count -lt 2) {
            throw "a single onfailure entry repeats forever - no escalation"
          }
          if ($xml -notmatch '<resetfailure>') {
            throw "no resetfailure window - unrelated crashes accumulate toward give-up"
          }
      - name: The health task must actually RUN, not merely register
        shell: pwsh
        run: |
          # This is the whole bug: schtasks /Create has no working-directory
          # option, so the task ran from System32. For a source checkout that is
          # `python -m palctl.daemon`, which resolves -m against the current
          # directory -> "No module named palctl", every five minutes, forever,
          # while register_health_task reported success because the task had
          # registered perfectly well. CI runs from a checkout, so it is exactly
          # the broken shape.
          schtasks /Query /TN palctl-health
          if ($LASTEXITCODE -ne 0) { throw "health task not registered by install-service" }
          # /FO LIST /V rather than /XML: it prints the command verbatim as
          # "Task To Run", with no XML entity escaping to see through, and it is
          # the same query the Last Result check below already needs.
          $info = (schtasks /Query /TN palctl-health /FO LIST /V) -join "`n"
          Write-Host $info
          if ($info -notmatch 'cd /d') {
            throw "the task carries no working directory - it cannot resolve -m palctl.daemon"
          }
          if ($info -notmatch [regex]::Escape($PWD.Path)) {
            throw "the task's working directory is not this checkout"
          }
          # Now the real proof: let the SCHEDULER run it, from its own directory,
          # and demand a zero exit. An unresolvable module exits non-zero here.
          schtasks /Run /TN palctl-health
          if ($LASTEXITCODE -ne 0) { throw "schtasks refused to run the health task" }
          # Poll until the run has really finished. Waiting only on Status is a
          # flake: for the first seconds after /Run the task can still read
          # "Ready" while Last Result is the placeholder 267011 ("has not yet
          # run") — which is not 0, so a naive check would fail a healthy task.
          # 267009 is "currently running". Treat both as not-finished-yet.
          $deadline = (Get-Date).AddSeconds(120)
          do {
            Start-Sleep -Seconds 3
            $v = (schtasks /Query /TN palctl-health /FO LIST /V) -join "`n"
            $status = if ($v -match 'Status:\s*(.+)') { $Matches[1].Trim() } else { '' }
            $last = if ($v -match 'Last Result:\s*(-?\d+)') { $Matches[1] } else { '' }
            $pending = ($status -eq 'Running') -or ($last -in @('', '267009', '267011'))
          } while ($pending -and (Get-Date) -lt $deadline)
          Write-Host $v
          if ($pending) { throw "the health task never finished within 120s" }
          Write-Host "health task last result: $last"
          if ($last -ne '0') {
            throw "the health task ran and failed (last result $last) - the command cannot resolve from the scheduler's directory"
          }
      - name: Reinstall over the RUNNING daemon (must replace it)
        shell: pwsh
        run: |
          python -m palctl.daemon install-service
          if ($LASTEXITCODE -ne 0) { throw "reinstall over a running daemon failed" }
          $newPid = @((Get-NetTCPConnection -LocalPort 8830 -State Listen).OwningProcess)[0]
          if ("$newPid" -eq "$env:DAEMON_PID") {
            throw "reinstall did NOT replace the running daemon (still PID $newPid)"
          }
          exit 0
      - name: Stand in for the game server, registered Manual like setup does
        shell: pwsh
        run: |
          # Setup registers the game service Manual whenever palctl runs as a
          # boot service, because palctl's daemon then starts it. A stand-in is
          # enough: nothing here starts the service, only reads and changes its
          # start type, which is all the handback touches.
          sc.exe create palctl-ci-server binPath= "C:\Windows\System32\cmd.exe /c ping -n 3600 127.0.0.1" start= demand
          if ($LASTEXITCODE -ne 0) { throw "could not create the stand-in game service" }
          python -c "from palctl.config import Config; c = Config.load(); c.service_name = 'palctl-ci-server'; c.save(); print('service_name ->', c.service_name)"
          $qc = (sc.exe qc palctl-ci-server) -join "`n"
          if ($qc -notmatch 'DEMAND_START') { throw "stand-in service is not Manual to begin with" }
      - name: Switch to login startup (removes the service, replaces the daemon)
        shell: pwsh
        run: |
          python -m palctl.daemon install-startup
          if ($LASTEXITCODE -ne 0) { throw "install-startup failed" }
          sc.exe query palctl-daemon
          if ($LASTEXITCODE -eq 0) { throw "service registration survived the switch to login startup" }
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v palctl-daemon
          if ($LASTEXITCODE -ne 0) { throw "Run key missing after install-startup" }
          if (-not (Get-NetTCPConnection -LocalPort 8830 -State Listen -ErrorAction SilentlyContinue)) {
            throw "no daemon answering after the switch"
          }
          exit 0
      - name: Leaving service mode hands the server's boot start back to Windows
        shell: pwsh
        run: |
          # A login-startup daemon does not exist until somebody signs in, so it
          # cannot be what starts the server at boot. Left Manual, the server
          # came up only if a human logged in within fifteen minutes of boot --
          # on a headless box, never -- and nothing said so.
          $qc = (sc.exe qc palctl-ci-server) -join "`n"
          Write-Host $qc
          if ($qc -notmatch 'AUTO_START') {
            throw "the game service is still Manual after palctl stopped being a boot service - nothing will start it at boot"
          }
      - name: A Disabled server service is never re-enabled behind the user
        shell: pwsh
        run: |
          # Disabled is somebody deliberately turning the server off. Quietly
          # switching it back on would be palctl making a decision that is not
          # its to make -- the same line the handback draws in the other
          # direction.
          sc.exe config palctl-ci-server start= disabled
          if ($LASTEXITCODE -ne 0) { throw "could not disable the stand-in service" }
          python -m palctl.daemon install-startup
          if ($LASTEXITCODE -ne 0) { throw "install-startup failed on the re-run" }
          $qc = (sc.exe qc palctl-ci-server) -join "`n"
          Write-Host $qc
          if ($qc -notmatch 'DISABLED') {
            throw "palctl re-enabled a service the user had deliberately disabled"
          }
          sc.exe delete palctl-ci-server
          exit 0
      - name: Full removal (nothing left registered or running)
        shell: pwsh
        run: |
          python -m palctl.daemon uninstall-startup
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v palctl-daemon
          if ($LASTEXITCODE -eq 0) { throw "Run key survived uninstall-startup" }
          python -c "from palctl import daemon; daemon._stop_daemon_process()"
          Start-Sleep -Seconds 2
          if (Get-NetTCPConnection -LocalPort 8830 -State Listen -ErrorAction SilentlyContinue) {
            throw "daemon still listening after removal"
          }
          exit 0

  as-user-lifecycle:
    # The failures that kept reaching real boxes lived in the one seam nothing
    # here executed: an INTERACTIVE user's GUI talking to a SERVICE under that
    # same account. The unit suite fakes the SCM (even on windows-latest), and
    # install-lifecycle above registers LocalSystem only — so the as-user path
    # and the token handshake were never machine-verified, and a same-user 401
    # (service resolving a different config dir than the shell) shipped green.
    # This job gives the runner's own account a password, registers the daemon
    # as a user-account service with it, and then demands the exact handshake
    # the GUI performs: the token read from the INTERACTIVE %APPDATA% must be
    # accepted by the service daemon. It also pins the two guarantees around
    # that handshake: config_dir without APPDATA resolves to AppData\Roaming
    # (not a Linux-style ~/.config), and the account password is scrubbed from
    # the service XML after registration.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PALCTL_CI_PW: "PalctlCi2026x!"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install httpx psutil keyring aiohttp discord.py
      - name: config_dir without APPDATA resolves like the GUI, not like Linux
        shell: pwsh
        run: |
          python -c "import os, sys; os.environ.pop('APPDATA', None); from palctl.config import config_dir; p = str(config_dir()); print('config_dir ->', p); sys.exit(0 if p.lower().endswith('appdata\\roaming\\palctl') else 1)"
          if ($LASTEXITCODE -ne 0) { throw "no-APPDATA fallback did not land in AppData\Roaming" }
      - name: Give the runner account a known password (a service logon needs one)
        shell: pwsh
        run: |
          net user $env:USERNAME $env:PALCTL_CI_PW
          if ($LASTEXITCODE -ne 0) { throw "could not set the account password" }
      - name: Register the daemon as a user-account service (the wizard's path)
        shell: pwsh
        run: |
          python -c "import os, sys; from palctl.daemon import install_service; sys.exit(0 if install_service(as_user=True, password=os.environ['PALCTL_CI_PW']) else 1)"
          if ($LASTEXITCODE -ne 0) { throw "as-user install-service failed (see output above for the reason)" }
          $qc = (sc.exe qc palctl-daemon) -join "`n"
          Write-Host $qc
          # ASSERT the logon account, don't just print it: the first run of
          # this job showed SERVICE_START_NAME : LocalSystem while everything
          # else was green — palctl wrote <username> where WinSW v2 wants
          # <domain>+<user>, the element was silently ignored, and --as-user
          # registered LocalSystem while claiming success.
          if ($qc -notmatch "SERVICE_START_NAME\s*:\s*.*$env:USERNAME") {
            throw "service did NOT register under $env:USERNAME - silent LocalSystem fallback is back"
          }
      - name: THE HANDSHAKE - the interactive token must be accepted by the service
        shell: pwsh
        run: |
          python -c "import sys, httpx; from palctl import localauth; r = httpx.get('http://127.0.0.1:8830/state', headers={localauth.TOKEN_HEADER: localauth.get_or_create_token()}, timeout=10); print('GET /state ->', r.status_code); sys.exit(0 if r.status_code == 200 else 1)"
          if ($LASTEXITCODE -ne 0) { throw "the service rejected the interactive user's token - the GUI<->service split is back" }
      - name: The account password must not persist in the service XML
        shell: pwsh
        run: |
          $xml = Get-Content "$env:APPDATA\palctl\bin\palctl-daemon-service.xml" -Raw
          if ($xml -match [regex]::Escape($env:PALCTL_CI_PW)) {
            throw "the Windows account password persisted in the WinSW XML"
          }
          Write-Host "XML holds no password (scrubbed after registration)"
      - name: The hung-daemon health task rides along, and leaves with the service
        shell: pwsh
        run: |
          schtasks /Query /TN palctl-health
          if ($LASTEXITCODE -ne 0) { throw "health task not registered by install-service" }
          # Removing the daemon is the OTHER way palctl stops being what starts
          # the game server at boot. install-lifecycle covers the install-startup
          # route; this covers uninstall-service, and it is the worse of the two
          # -- it leaves the server Manual with nothing alive to start it at all.
          sc.exe create palctl-ci-server binPath= "C:\Windows\System32\cmd.exe /c ping -n 3600 127.0.0.1" start= demand
          if ($LASTEXITCODE -ne 0) { throw "could not create the stand-in game service" }
          python -c "from palctl.config import Config; c = Config.load(); c.service_name = 'palctl-ci-server'; c.save()"
          python -m palctl.daemon uninstall-service
          schtasks /Query /TN palctl-health
          if ($LASTEXITCODE -eq 0) { throw "health task survived uninstall-service" }
          sc.exe query palctl-daemon
          if ($LASTEXITCODE -eq 0) { throw "service survived uninstall-service" }
          $qc = (sc.exe qc palctl-ci-server) -join "`n"
          Write-Host $qc
          if ($qc -notmatch 'AUTO_START') {
            throw "removing palctl left the game service Manual - nothing will ever start it again"
          }
          sc.exe delete palctl-ci-server
          exit 0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check palctl tests

  import-smoke:
    # The unit tests deliberately skip the GUI, daemon, and bot. This job proves
    # the whole package still imports with the real dependencies installed, so a
    # broken import in those files can't ship unnoticed. PySide6 needs a few GL/Qt
    # system libs even just to import under the offscreen platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0   # setuptools-scm needs tags/history to resolve the version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries for headless PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
      - run: pip install -e .
      - name: Import every module (offscreen Qt, no secret store)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: python scripts/import_smoke.py
      # The GUI's thread lifecycle needs a real QApplication, so it can only run
      # where Qt is installed — here. Quitting used to destroy the still-running
      # Poller, which makes Qt abort the process: the user's last interaction
      # with palctl was a crash dialog. These tests skip everywhere else, so
      # this step is the only thing standing between that and shipping again.
      - name: GUI thread lifecycle (needs a real QApplication)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          pip install pytest
          pytest tests/test_gui_lifecycle.py -v
