[project]
name = "palctl"
dynamic = ["version"]  # single source: palctl/__init__.py
description = "REST-native Palworld dedicated server control for Windows: memory-leak watchdog, settings editor, self-hosted Discord bot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "httpx>=0.27",
  "psutil>=6.0",
  "keyring>=25.0",
  "aiohttp>=3.10",
  "discord.py>=2.4",
  "PySide6>=6.7",
  # palctl/fetch.py imports certifi directly — it is the fallback CA bundle
  # that makes downloads work on boxes whose system trust store can't verify
  # (AV doing HTTPS interception, a stripped store). It arrived only through
  # httpx's own requirements, so the one code path that exists for broken
  # certificate environments depended on another package's transitive graph.
  "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.11",
  # Pinned, not floored, and kept equal to the version .github/workflows/ci.yml
  # installs. A linter's output is a gate, so an unpinned one means the gate
  # changes meaning on someone else's release schedule — and a contributor whose
  # ruff is a version behind CI's gets "clean" locally for a commit CI rejects.
  "ruff==0.16.2",
]

[project.scripts]
palctl = "palctl.cli:main"
palctl-daemon = "palctl.daemon:main"
palctl-gui = "palctl.gui.main:main"

[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The git tag IS the version — nothing to bump in code, so a tag can never
# disagree with the shipped version. setuptools-scm writes the resolved version
# into palctl/_version.py at build/install time; palctl/__init__.py reads it.
version_file = "palctl/_version.py"

[tool.setuptools.packages.find]
include = ["palctl*"]

[tool.setuptools.package-data]
# The web dashboard the daemon serves at / — one self-contained file.
palctl = ["dashboard.html"]
# The GUI icon set (tinted at runtime by palctl/gui/icons.py). app-icon-tile.svg
# is the composed brand tile used for the window/taskbar icon.
"palctl.gui" = ["icons/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The selection used to be E/F/W/I/UP/B, and the code had quietly outgrown it:
# `# noqa: S310` and `# noqa: BLE001` markers were sitting in the tree for rules
# that were never switched on, so they read as "checked and accepted" while
# nothing was checking. RUF100 (below) is what keeps that from drifting back —
# it fails on a noqa that suppresses nothing.
#
# ASYNC is the one that earns its place on merit: this is a daemon whose whole
# job is an event loop, and a blocking call on it stalls the poll loop, the
# watchdog and the control API together.
select = [
  "E", "F", "W", "I", "UP", "B",
  "ASYNC",  # blocking calls on the event loop
  "S",      # bandit: subprocess, temp files, download/verification surfaces
  "LOG",    # logging misuse
  "C4",     # comprehension cleanups
  "PIE",    # small correctness/idiom cleanups
  "A",      # shadowing a builtin
  "RUF",    # incl. RUF100, the guard on stale noqa above
]
ignore = [
  # Polling deadlines with an interval, not candidates for `asyncio.timeout`:
  # these wait on an external state machine (the SCM, the game's REST API) and
  # report whether it arrived, rather than cancelling a body of work.
  "ASYNC109",
  # `assert` is the point in tests, and steamcmd.py asserts a Popen invariant
  # that mypy/readers both want stated.
  "S101",
  # Every subprocess call in this tree passes an argv list with no shell. That
  # is the correct form; S603 flags it regardless.
  "S603",
  # Deliberate, and individually commented at each site: best-effort cleanup
  # and diagnostics paths that must never take the daemon down with them.
  "S110", "S112",
  # "0.0.0.0" is a documented opt-in (LAN dashboard access) with its own startup
  # warning — see lan_exposure_warning — not an accident.
  "S104",
  # Header names and keyring key names, not credentials.
  "S105", "S106", "S107",
  # Em dashes and arrows are used deliberately throughout the prose.
  "RUF001", "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# Tests stand up fake servers, fake credentials and temp paths on purpose.
"tests/*" = ["S"]

[tool.coverage.run]
source = ["palctl"]
omit = [
  # Generated by setuptools-scm at build time.
  "palctl/_version.py",
  # The coverage job installs the minimal dependency set and never imports the
  # GUI, so measuring it here would report 1,500 statements at 0% and drag the
  # number to something nobody could act on. The GUI is covered by the
  # import-smoke job (every module imports, under a real Qt) and by
  # test_gui_lifecycle.py (thread teardown, the crash-on-quit regression).
  "palctl/gui/*",
]

[tool.coverage.report]
show_missing = true
# A floor, not a target. Current measured coverage of the non-GUI tree is ~72%,
# so this catches a real regression — a module that stops being exercised at
# all — without turning every refactor into a coverage negotiation. It reads
# lower than the suite deserves for one honest reason: daemon.py's runtime
# paths are driven end-to-end by the `scenarios` job, which doesn't run here.
fail_under = 70
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
files = ["palctl"]
# palctl is a Windows tool. Checked as win32 so `winreg` resolves — on Linux
# typeshed hides it behind sys.platform and every registry call in startup.py,
# discovery.py and preflight.py reads as an error against a module that isn't
# there. The handful of POSIX-only calls left over are suppressed at the line,
# not by loosening this.
platform = "win32"
# PySide6, discord.py, psutil and keyring ship no stubs (or partial ones); the
# point of this gate is palctl's own types, not third-party surface area.
ignore_missing_imports = true
# Deliberately not strict. Annotations here are already careful and consistent,
# so this catches the class of mistake they were written to prevent — CFG-02,
# a str reaching an int field, was exactly that — without a migration first.
warn_redundant_casts = true
warn_unused_ignores = true
# The tree carried `# type: ignore[arg-type]` markers naming a code neither
# line ever raised: written for a checker nobody ran, reading as "checked" to
# every reviewer since. This is the RUF100 of type comments and it is on for
# the same reason.

[tool.pytest.ini_options]
testpaths = ["tests"]
# CI runs a bare `pytest` (not `python -m pytest`), so the repo root isn't on
# sys.path and the in-tree `palctl` package can't be imported. Put it on the
# path explicitly so the suite runs the same way everywhere.
pythonpath = ["."]
markers = [
    # End-to-end scenarios against tests/sim: a real daemon subprocess driving a
    # fake service manager and a fake Palworld server. Minutes, not seconds, so
    # they're addressable on their own (`-m sim`) and skippable (`-m 'not sim'`).
    "sim: end-to-end scenario against the simulated machine (slow)",
]
